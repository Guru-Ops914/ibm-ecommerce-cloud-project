name: Node.js CI + AWS OIDC

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript
        run: npm run check

  aws-auth:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-IBM-Ecommerce

      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install production dependencies
        run: npm install --omit=dev

      - name: Create deployment package
        run: tar -czf ecommerce-app.tar.gz app.js package.json node_modules

      - name: Upload deployment package to S3
        run: aws s3 cp ecommerce-app.tar.gz s3://${{ vars.DEPLOY_BUCKET }}/deployments/ecommerce-app.tar.gz
