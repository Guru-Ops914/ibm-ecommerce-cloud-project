name: Node.js CI + AWS OIDC

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript
        run: npm run check

  oidc-diagnostic:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub OIDC token and print safe claims
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          TOKEN="$(printf '%s' "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')"
          PAYLOAD="$(printf '%s' "$TOKEN" | cut -d. -f2)"
          export PAYLOAD
          python3 - <<'PY'
          import os, json, base64
          p=os.environ["PAYLOAD"]
          p += "=" * (-len(p) % 4)
          claims=json.loads(base64.urlsafe_b64decode(p).decode())
          for key in ("iss","aud","sub","repository","repository_id","repository_owner","repository_owner_id","ref","ref_type"):
              print(f"{key}: {claims.get(key)}")
          PY
